# Which profile each agent-* config dir belongs to.
# Format: <config-dir-name> <profile>
#
# A machine opts in via DOTFILES_PROFILE in ~/.dotfiles-profile.local
# (comma-separated). Only listed dirs are ever bundled, and only the
# files in SECRETS_ALLOWED_FILES within them.
#
# Defaults below are 'work' because that is the more restrictive
# choice — reassign anything personal and re-run --secrets-seal.

agent-code-review                work
agent-dd                         work
agent-deepweb                    work
agent-dlocal                     work
agent-fathom                     work
agent-incident                   work
agent-mongo                      work
agent-notion                     work
agent-posthog                    work
agent-postmark                   work
agent-sql                        work
agent-statsig                    work
agent-stripe                     work
agent-vercel                     work
app.paulie.agent-slack           work
